[project]
name = "hirato-secretary"
version = "0.1.0"
requires-python = "==3.13.3"
description = "Hirato Secretary — a channel-based LLM memory assistant"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain_community",
    "langchain-openai",
    "fastapi",
    "uvicorn[standard]",
    "requests",
    "chromadb",
    "python-dotenv",
    "python-multipart",
    "aiosqlite",
    "httpx",
    "python-telegram-bot>=21.0",
]

[tool.poe.tasks]
dev = "uvicorn main:app --port 7950 --reload"
